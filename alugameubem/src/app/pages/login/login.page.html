<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Entrar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-pad">
    <h2 class="headline">Que bom te ver de novo</h2>
    <p>Entre para continuar alugando com a sua comunidade.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <ion-list lines="none">
        <ion-item class="field">
          <ion-input label="E-mail" labelPlacement="stacked" type="email" formControlName="email" autocomplete="email"></ion-input>
        </ion-item>
        <ion-item class="field">
          <ion-input label="Senha" labelPlacement="stacked" type="password" formControlName="password" autocomplete="current-password"></ion-input>
        </ion-item>
      </ion-list>
      @if (mensagemErro()) {
        <p class="erro">{{ mensagemErro() }}</p>
      }
      <ion-button expand="block" type="submit" class="btn-pill btn-lime" [disabled]="carregando()">
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </ion-button>
    </form>

    <p class="switch">
      Ainda não tem conta?
      <a routerLink="/cadastro">Criar conta</a>
    </p>
  </div>
</ion-content>
